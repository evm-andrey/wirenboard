# Native Web UI styling; assets activate only for dashboard_lighting.
sub_filter '</head>' '<link rel="stylesheet" href="/room-lighting-assets/style.css?v=20261003"><script src="/room-lighting-assets/theme.js?v=20261003" defer></script></head>';
sub_filter_once on;

location ^~ /room-lighting-assets/ {
    alias /mnt/data/etc/wb-lighting-ui/;
    autoindex off;
    add_header Cache-Control "no-store";
}
